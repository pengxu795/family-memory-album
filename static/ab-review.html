<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>视觉检索盲审</title><style>
*{box-sizing:border-box}body{margin:0;background:#ffffff;color:#131314;font-family:-apple-system,"PingFang SC",sans-serif}.top{position:sticky;top:0;z-index:5;background:#f4f4f2ee;backdrop-filter:blur(14px);padding:18px 24px;border-bottom:1px solid #e3e3e0}.top h1{margin:0 0 6px;font-size:18px}.muted{color:#797979;font-size:12px}.nav{display:flex;gap:7px;overflow:auto;padding:12px 24px}.nav button{white-space:nowrap;border:1px solid #e3e3e0;background:#ffffff;border-radius:16px;padding:7px 11px}.nav button.on{background:#131314;color:#fff}.main{padding:10px 24px 40px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card{background:#ffffff;border:2px solid transparent;border-radius:10px;overflow:hidden}.card.relevant{border-color:#4b9b67}.card.not_relevant{border-color:#e5484d}.card.unsure{border-color:#ffb300}.thumb{position:relative}.thumb img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#ebebe9}.badge{position:absolute;right:6px;top:6px;background:#000b;color:#fff;border-radius:10px;padding:3px 6px;font-size:10px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:7px}.actions button{border:0;border-radius:6px;padding:7px 2px}.yes{background:#dcecdf}.no{background:#fdeeee}.maybe{background:#fff6e0}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
</style><link rel="stylesheet" href="/theme.css?v=06">
</head><body><header class="top"><h1>视觉检索独立盲审</h1><div id="status" class="muted">读取中…</div><div class="muted">页面不显示模型、分数和排名，只判断图片是否符合查询。</div></header><nav id="nav" class="nav"></nav><main class="main"><h2 id="title"></h2><div id="grid" class="grid"></div></main><script>
let data={groups:[]},current=0;
const statusEl=document.getElementById('status'),navEl=document.getElementById('nav'),titleEl=document.getElementById('title'),gridEl=document.getElementById('grid');
async function load(){data=await fetch('/api/ab-review').then(r=>r.json());statusEl.textContent=`进度 ${data.reviewed||0} / ${data.total||0}`;renderNav();render()}
function renderNav(){navEl.innerHTML=data.groups.map((g,i)=>`<button class="${i===current?'on':''}" onclick="current=${i};renderNav();render()">${g.query_text} · ${g.variant}</button>`).join('')}
function render(){const g=data.groups[current];if(!g){titleEl.textContent='排名尚未生成';gridEl.innerHTML='';return}titleEl.textContent=`${g.query_text} · ${g.variant}`;gridEl.innerHTML=g.items.map(x=>`<article class="card ${x.label||''}" id="c-${x.asset_id}"><div class="thumb"><img loading="lazy" src="/thumb?asset=${x.asset_id}&edge=480" onerror="this.closest('article')?.remove()">${x.type==='video'?'<span class="badge">视频</span>':''}</div><div class="actions"><button class="yes" onclick="mark('${x.asset_id}','relevant')">相关</button><button class="no" onclick="mark('${x.asset_id}','not_relevant')">不相关</button><button class="maybe" onclick="mark('${x.asset_id}','unsure')">不确定</button></div></article>`).join('')}
async function mark(asset,label){const g=data.groups[current];await fetch('/api/ab-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query_id:g.query_id,variant:g.variant,asset_id:asset,label})});const x=g.items.find(x=>x.asset_id===asset);x.label=label;document.querySelector(`#c-${asset}`).className=`card ${label}`;data.reviewed=data.groups.flatMap(x=>x.items).filter(x=>x.label).length;statusEl.textContent=`进度 ${data.reviewed} / ${data.total}`}
load();
</script></body></html>
