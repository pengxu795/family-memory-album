<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人物管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<script>if(location.protocol==='file:')location.replace('http://localhost:8788/people.html');</script>
<style>
/* ===== 与家庭影像总库同根 token ===== */
:root{--bg:#ffffff;--card:#fff;--ink:#131314;--muted:#8e8e88;--line:#ebebe9;--accent:#2f31f5;--accent-soft:#e5484d14;--danger:#e5484d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue","PingFang SC",sans-serif}button,input,select{font:inherit}

/* ===== 顶栏：与 library 完全相同的三段式（左：返回 + 标题块 / 中：空 / 右：搜索 + 操作） =====
   library.html 用 grid 三列 + 中列绝对居中。这里单页不需要中间标题，所以保留 grid 但合并到左列。
   关键：h1 字号 18 / font-weight 500 / sub 11 / 按钮 12px 圆角 18（与 .bar-btn 一致） */
.top{height:72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:0 28px;position:sticky;top:0;background:#f4f4f2f2;backdrop-filter:blur(18px);z-index:10;border-bottom:1px solid var(--line)}
.top .top-left{display:flex;align-items:center;gap:18px;min-width:0}
.top .top-mid{font-family:'Orbitron','DIN Alternate','SF Mono','Menlo','Courier New',monospace;font-size:11px;letter-spacing:1px;color:var(--ink);text-align:center;font-weight:600;white-space:nowrap}
.top .top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.top h1{font-size:18px;font-weight:500;margin:0;line-height:1.2}
.top .sub{margin:2px 0 0;color:var(--muted);font-size:11px}
/* 返回按钮 + 主操作按钮：library 的 .bar-btn / .nav-btn 同款 */
.back,.primary,.quiet,.danger{font-size:12px;border:1px solid var(--line);background:#ffffff;border-radius:18px;padding:7px 14px;cursor:pointer;color:var(--ink);transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.back:hover,.quiet:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.primary:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.danger{color:var(--danger);border-color:#efefed;background:#ffffff}
.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.back svg,.primary svg{width:14px;height:14px}

/* ===== 主体宽度 1080，与 library 一致 ===== */
.wrap{max-width:1080px;margin:0 auto;padding:18px 28px 60px}

/* ===== 统计条：两块卡片（已确认人物 / 人脸已处理影像），与顶栏 brand-count 风格一致 ===== */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 16px;display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:border-color .15s,transform .15s}
.stat:hover{border-color:var(--accent)}
.stat .stat-main{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.stat b{font-family:'Orbitron','DIN Alternate','SF Mono','Menlo','Courier New',monospace;font-size:18px;font-weight:600;color:var(--ink);letter-spacing:.5px;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .num-sub{font-size:11px;color:var(--muted);font-family:'Orbitron','DIN Alternate','SF Mono','Menlo','Courier New',monospace;font-variant-numeric:tabular-nums}
.stat .stat-label{font-size:11px;color:var(--muted);margin-top:2px}
.stat .stat-foot{font-size:11px;color:var(--accent);margin-top:4px;display:inline-flex;align-items:center;gap:3px}
.stat .stat-foot::after{content:"→";font-size:11px}

/* ===== 区块标题：与 library .sg-month-head / .custom-bar 字号系统一致（11/16） ===== */
section{margin-top:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec-head h2{font-size:16px;font-weight:600;margin:0;letter-spacing:.2px}
.sec-head .sec-meta{display:flex;align-items:baseline;gap:10px;color:var(--muted);font-size:11px}
.sec-head .sec-meta b{font-family:'Orbitron','DIN Alternate','SF Mono','Menlo','Courier New',monospace;font-size:11px;font-weight:600;letter-spacing:1px;color:var(--ink);font-variant-numeric:tabular-nums}

/* ===== 人物卡片：
   - library 网格密度（4 列 3px gap → 这里 170px minmax + 12px gap 接近）
   - 卡片无边框/无圆角 → 改为 1px line + 10px 圆角，对齐统计卡
   - hover 阴影同 library .asset：0 4px 12px #00000020 + translateY(-2px)
   - 信息区紧凑：14/11/11 ===== */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.person{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s;display:flex;flex-direction:column;position:relative}
.person:hover{box-shadow:0 4px 12px #00000020;transform:translateY(-2px);border-color:var(--accent)}
.editBtn{position:absolute;top:8px;right:8px;z-index:2;border:0;background:#0009;color:#fff;border-radius:10px;padding:4px 9px;font-size:11px;cursor:pointer;opacity:0;transition:opacity .15s}
.person:hover .editBtn{opacity:1}
.av{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;aspect-ratio:4/3;background:#ebebe9}
.av img{width:100%;height:100%;object-fit:cover;background:#ebebe9}
.av.one img:first-child{grid-column:1/3;grid-row:1/3;object-fit:cover}
.av .fc{position:relative;overflow:hidden;background:#ebebe9}
.av .fc img{position:absolute;max-width:none}
.av.one .fc:first-child{grid-column:1/3;grid-row:1/3}
.hero-av{width:100%;aspect-ratio:4/3;position:relative;overflow:hidden;background:#ebebe9}
.hero-av img{position:absolute;display:block;max-width:none;width:100%;height:100%;object-fit:cover}
/* 信息区：与 library .asset 字号系统一致：标题 14/数字 10-11/标签 10 */
.p-info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.p-info .p-name{font-size:14px;font-weight:600;color:var(--ink);line-height:1.3}
.p-info .rel{font-size:10px;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:2px 8px;border-radius:10px;font-weight:500;letter-spacing:.3px;margin-top:1px}
.p-info .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px;display:flex;align-items:center;gap:6px}
.p-info .cnt .dot{width:3px;height:3px;border-radius:50%;background:var(--line);display:inline-block}

/* 添加成员占位卡：与 .person 同高，dashed 边框用 line 颜色、字号一致 */
.add-card{background:transparent;border:1.5px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);cursor:pointer;min-height:200px;transition:border-color .15s,color .15s,background .15s}
.add-card:hover{border-color:var(--accent);color:var(--accent);background:#ffffff}
.add-card .plus{font-size:22px;line-height:1;width:36px;height:36px;border-radius:50%;border:1.5px dashed currentColor;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s}
.add-card:hover .plus{border-style:solid}
.add-card span{font-size:12px;letter-spacing:.3px}

/* ===== 弹层：library .pin-card / .pickmodal 同款（圆角 14/16、字 15、按钮圆角 14） ===== */
.mask{position:fixed;inset:0;background:#0006;backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}
.mask.show{display:flex}
.modal{background:#ffffff;border-radius:14px;width:min(420px,100%);padding:22px 24px 20px;box-shadow:0 18px 50px #0003}
.modal h3{margin:0 0 16px;font-size:15px;font-weight:600;letter-spacing:.2px}
.modal label{display:block;font-size:11px;color:var(--muted);margin:14px 0 6px;font-weight:500}
.modal input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#ffffff;font-size:13px;outline:none}
.modal input:focus{border-color:var(--accent)}
.av-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.av-grid button{border:2px solid var(--line);border-radius:8px;padding:0;overflow:hidden;cursor:pointer;background:#ebebe9;aspect-ratio:1;transition:border-color .15s,transform .15s}
.av-grid button:hover{border-color:var(--accent);transform:scale(1.03)}
.av-grid button.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.av-grid img{width:100%;height:100%;object-fit:cover;display:block}
.av-clear{margin-top:8px;border:0;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;text-decoration:underline;padding:0}
.av-clear:hover{color:var(--accent)}
.modal-actions{display:flex;gap:8px;margin-top:22px;align-items:center}
.modal-actions .spacer{flex:1}
.modal .del-hint{font-size:11px;color:var(--danger);margin-top:14px;line-height:1.6;padding:10px 12px;background:#fdeeee;border-radius:8px}

/* ===== toast：library 没有自定义 toast，沿用黑底胶囊 + 圆角 14 ===== */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#131314;color:#fff;border-radius:14px;padding:11px 18px;font-size:12px;opacity:0;transition:opacity .25s;z-index:30;max-width:90vw;pointer-events:none}

@media(max-width:640px){.top{padding:0 16px;height:64px;grid-template-columns:auto 1fr auto;gap:10px}.top .top-mid{display:none}.wrap{padding:14px 14px 50px}.stats{grid-template-columns:1fr;gap:8px}.people{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.stat b{font-size:16px}}
</style>

<link rel="stylesheet" href="/ui.css?v=2">
</head>
<body>
<header class="top">
  <div class="top-left">
    <button class="back" onclick="location.href='/library.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>影像总库
    </button>
    <div><h1>人物管理</h1><p class="sub">认领人脸 → 其余照片自动归类；上限 30 人</p></div>
  </div>
  <div class="top-mid">PEOPLE · 人物</div>
  <div class="top-right">
    <button class="primary" onclick="location.href='/faces.html'">
      去照片上标注
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="stats" id="stats"></div>

  <section>
    <div class="sec-head">
      <h2>家庭成员</h2>
      <div class="sec-meta">点击卡片编辑信息或删除 · <b id="secCount">0</b> 人</div>
    </div>
    <div class="people" id="people"></div>
  </section>

  <section id="candSec" style="display:none">
    <div class="sec-head"><h2>待确认人物组</h2><div class="sec-meta">系统把同一人的多次出现归为一组，确认后自动归类</div></div>
    <div class="cands" id="cands"></div>
  </section>
</main>

<div class="mask" id="mask">
  <div class="modal">
    <h3 id="mTitle">编辑人物</h3>
    <label>姓名</label><input id="mName" placeholder="如：爷爷">
    <label>家庭关系</label><input id="mRel" placeholder="如：爷爷、表哥（选填）">
    <label>出生日期</label><input id="mBirth" type="date">
    <div id="mAvatarSec" style="display:none">
      <label>头像（从已确认人脸里选一张）</label>
      <div class="av-grid" id="mAvatarGrid"></div>
      <button class="av-clear" id="mAvatarClear" style="display:none" onclick="clearAvatar()">恢复自动样例</button>
    </div>
    <div class="modal-actions">
      <button class="danger" id="mDel" style="display:none" onclick="delPerson()">删除</button>
      <span class="spacer"></span>
      <button class="quiet" onclick="closeModal()">取消</button>
      <button class="primary" onclick="savePerson()">保存</button>
    </div>
    <p class="del-hint" id="mDelHint" style="display:none">删除后该人物所有照片里的人脸会回到待认领池，照片本身不受影响。</p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let state={people:[],candidates:[]}, editingId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=id=>`/thumb?asset=${encodeURIComponent(id)}&edge=480`;
let toastTimer;
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.opacity=0,4000)}
async function api(body={}){
  const r=await fetch('/api/people',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok)throw Error(d.error||'操作失败');
  state=d;render();
}
function avatars(x){
  // 头像用服务端高清人脸裁切(/face_crop)，替代此前 /thumb + CSS 2× 放大：
  // 后者裁切乱、分辨率低；优先用用户自选头像(avatar_face_id)，否则取自动样例
  const faces=(x.sample_faces||[]).filter(f=>f.face_instance_id);
  const fid=x.avatar_face_id||(faces[0]&&faces[0].face_instance_id);
  if(fid){
    const src=`/face_crop?face=${encodeURIComponent(fid)}&k=2.4&size=480&v=5`;
    return `<div class="hero-av" data-pid="${esc(x.person_id)}"><img loading="lazy" decoding="async" src="${src}" onerror="imgFail(this)"></div>`;
  }
  const id=(x.sample_assets||[])[0];
  return id?`<div class="hero-av" data-pid="${esc(x.person_id)}"><img loading="lazy" decoding="async" src="${url(id)}" onerror="imgFail(this)"></div>`
    :`<div class="hero-av"></div>`;
}
// 2026-09-17：图片读不出来时不再删掉容器（旧行为会让人物头像/人脸整块消失）。
// 先原地重试一次，仍失败则占位显示「读图失败」，位置保留。
function imgFail(el){
  const src=el.getAttribute('src')||'';
  if(src&&!el.dataset.retried){
    el.dataset.retried='1';
    setTimeout(()=>{el.src=src+(src.includes('?')?'&':'?')+'_r='+Date.now()},800);
    return;
  }
  el.onerror=null;
  const box=el.closest('.hero-av,.crop,.fc,.pick,.av')||el.parentElement;
  if(!box)return;
  box.classList.add('imgerr');
  el.style.display='none';
  if(!box.querySelector('.imgerr-tag'))box.insertAdjacentHTML('beforeend','<span class="imgerr-tag">读图失败</span>');
}
function cropStyle(b){
  const W=+b.image_width||1000,H=+b.image_height||750,r=W/H;
  let w=Math.max(+b.w||0.01,0.001),h=Math.max(+b.h||0.01,0.001);
  let x=+b.x||0,y=+b.y||0;
  const cx=x+w/2,cy=y+h/2;
  w=Math.min(w*2,1);h=Math.min(h*2,1);
  x=Math.max(0,cx-w/2);y=Math.max(0,cy-h/2);
  w=Math.min(w,1-x);h=Math.min(h,1-y);
  const wp=100*Math.max(1/w,r/h);
  const hp=100*Math.max(1/(w*r),1/h);
  return `width:${wp.toFixed(2)}%;height:${hp.toFixed(2)}%;left:${(-x*wp).toFixed(2)}%;top:${(-y*hp).toFixed(2)}%;`;
}
function cropCell(s,extra=''){
  const dt=(s.capture_time||'').slice(0,10);
  return `<div class="fc" ${extra}><img loading="lazy" src="${url(s.asset_id)}" style="${cropStyle(s.bbox)}" title="${esc(dt)}${s.face_instance_id?'':''}"></div>`;
}
function render(){
  const p=state.people||[], c=state.candidates||[];
  // 统计条（数字用 Orbitron 等宽 + sub 灰色，参考 library 月份标签风格）
  $('stats').innerHTML=`
    <div class="stat" onclick="location.href='/faces.html'">
      <div class="stat-main"><b>${p.length}</b><span class="num-sub">/ ${state.max_people||30}</span></div>
      <span class="stat-label">已确认人物</span>
      <span class="stat-foot">上限 ${state.max_people||30} 人</span>
    </div>
    <div class="stat" onclick="location.href='/faces.html'">
      <div class="stat-main"><b>${Number(state.unresolved_face_count||0).toLocaleString()}</b><span class="num-sub">张</span></div>
      <span class="stat-label">待认领人脸</span>
      <span class="stat-foot">去标注</span>
    </div>`;
  $('secCount').textContent=p.length;
  // 家庭成员
  $('people').innerHTML=p.map(x=>`<article class="person" data-id="${esc(x.person_id)}">
      <button class="editBtn" onclick="event.stopPropagation();openEdit('${esc(x.person_id)}')">编辑</button>
      <div onclick="location.href='/person.html?person_id=${esc(x.person_id)}'">${avatars(x)}
      <div class="p-info">
        <span class="p-name">${esc(x.display_name||'未命名')}</span>
        ${x.relationship_label?`<span class="rel">${esc(x.relationship_label)}</span>`:''}
        <span class="cnt">${Number(x.asset_count||0).toLocaleString()} 项影像<span class="dot"></span>${Number(x.face_count||0).toLocaleString()} 张人脸</span>
      </div></div></article>`).join('')
    + `<div class="add-card" onclick="openAdd()"><span class="plus">＋</span><span>添加成员</span></div>`;
  // 待确认人物组默认隐藏
  $('cands').innerHTML='';
}
function openAdd(){editingId=null;$('mTitle').textContent='添加成员';$('mName').value='';$('mRel').value='';$('mBirth').value='';$('mDel').style.display='none';$('mDelHint').style.display='none';$('mAvatarSec').style.display='none';$('mask').classList.add('show');setTimeout(()=>$('mName').focus(),50)}
function openEdit(id){const x=(state.people||[]).find(p=>p.person_id===id);if(!x)return;editingId=id;$('mTitle').textContent=`编辑 · ${x.display_name||'未命名'}`;$('mName').value=x.display_name||'';$('mRel').value=x.relationship_label||'';$('mBirth').value=x.birth_date||'';$('mDel').style.display='';$('mDelHint').style.display='';renderAvatarPicker(x);$('mAvatarSec').style.display='';$('mask').classList.add('show')}
function renderAvatarPicker(x){
  const faces=(x.sample_faces||[]).filter(f=>f.face_instance_id);
  if(!faces.length){$('mAvatarGrid').innerHTML='<span style="grid-column:1/-1;color:var(--muted);font-size:11px;padding:8px 0">该人物还没有已确认的人脸</span>';$('mAvatarClear').style.display='none';return}
  const cur=x.avatar_face_id;
  $('mAvatarGrid').innerHTML=faces.map(f=>`<button class="${f.face_instance_id===cur?'cur':''}" data-fid="${esc(f.face_instance_id)}" onclick="pickAvatar('${esc(f.face_instance_id)}')"><img loading="lazy" decoding="async" src="/face_crop?face=${encodeURIComponent(f.face_instance_id)}&k=2.4&size=240&v=5" onerror="imgFail(this)"></button>`).join('');
  $('mAvatarClear').style.display=cur?'':'none';
}
async function pickAvatar(fid){
  if(!editingId)return;
  try{
    const r=await fetch('/api/people',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'set_avatar',person_id:editingId,face_instance_id:fid})});
    const d=await r.json();if(!r.ok)throw Error(d.error||'设置失败');
    // 更新本地 state 并重渲染（弹窗状态不受 render 影响）
    const x=(state.people||[]).find(p=>p.person_id===editingId);
    if(x){x.avatar_face_id=fid;renderAvatarPicker(x)}
    render();
    toast('头像已更新');
  }catch(e){toast(e.message)}
}
async function clearAvatar(){
  if(!editingId)return;
  try{
    const r=await fetch('/api/people',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'set_avatar',person_id:editingId,face_instance_id:''})});
    const d=await r.json();if(!r.ok)throw Error(d.error||'清除失败');
    const x=(state.people||[]).find(p=>p.person_id===editingId);
    if(x){x.avatar_face_id=null;renderAvatarPicker(x)}
    render();
    toast('已恢复自动样例头像');
  }catch(e){toast(e.message)}
}
function closeModal(){$('mask').classList.remove('show')}
$('mask').addEventListener('click',e=>{if(e.target===$('mask'))closeModal()});
// ESC 关闭编辑/添加弹窗（与 person.html 换头像弹窗行为一致）
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if($('mask').classList.contains('show')){e.preventDefault();closeModal()}
});
async function savePerson(){
  const name=$('mName').value.trim();
  if(!name){toast('姓名不能为空');$('mName').focus();return}
  try{
    if(editingId) await api({action:'update',person_id:editingId,display_name:name,relationship_label:$('mRel').value.trim(),birth_date:$('mBirth').value});
    else await api({action:'create',display_name:name,relationship_label:$('mRel').value.trim(),birth_date:$('mBirth').value});
    closeModal();toast(editingId?'已保存':'已添加');
  }catch(e){toast(e.message)}
}
async function delPerson(){
  if(!editingId)return;
  const x=(state.people||[]).find(p=>p.person_id===editingId);
  if(!confirm(`确定删除「${x?x.display_name:'该人物'}」？\n\n其照片里的人脸将回到待认领池，照片本身不会删除。`))return;
  try{await api({action:'delete',person_id:editingId});closeModal();toast('已删除')}catch(e){toast(e.message)}
}
async function assignCluster(cid){
  const pid=$('cand_'+cid).value;
  if(!pid){toast('请先选择要确认给哪位成员');return}
  try{await api({action:'assign_cluster',person_id:pid,cluster_id:cid});toast('已确认，自动归类将在后台进行')}catch(e){toast(e.message)}
}
async function ignoreCluster(cid){
  try{await api({action:'ignore_cluster',cluster_id:cid});toast('已忽略该路人组')}catch(e){toast(e.message)}
}
api().catch(e=>{toast('读取失败：'+e.message)});
</script>
<script src="offline-guard.js"></script>
</body>
