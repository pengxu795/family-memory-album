<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照片标注人物</title>
<style>
:root{--bg:#ffffff;--ink:#131314;--muted:#85857f;--line:#ebebe9;--accent:#2f31f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue","PingFang SC",sans-serif}button,select,input{font:inherit}
.top{min-height:72px;padding:12px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;position:sticky;top:0;background:#f4f4f2f2;backdrop-filter:blur(16px);z-index:5}.top h1{font-size:18px;margin:0}.top p,.status{font-size:12px;color:var(--muted);margin:3px 0 0}
.back,.primary,.quiet{border:1px solid var(--line);background:#ffffff;border-radius:22px;padding:9px 15px;cursor:pointer}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.quiet{background:#ffffff}
.toolbar{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar input{border:1px solid var(--line);border-radius:20px;padding:9px 13px;background:#ffffff;min-width:170px}
.tabs{display:flex;gap:6px;background:#ebebe9;border-radius:22px;padding:4px}.tabs button{border:0;background:transparent;border-radius:18px;padding:7px 14px;cursor:pointer;font-size:13px}.tabs button.on{background:#ffffff;font-weight:600;box-shadow:0 1px 3px #0002}
.wrap{padding:24px 28px;max-width:1180px;margin:auto}.status{margin-bottom:14px}
.searchbar{display:flex;gap:8px;margin-bottom:16px}.searchbar input{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 14px;background:#ffffff}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.shot{position:relative;border:0;padding:0;background:#ebebe9;border-radius:10px;overflow:hidden;cursor:pointer}.shot img{width:100%;display:block}.shot span{position:absolute;left:6px;bottom:6px;background:#000b;color:#fff;border-radius:11px;padding:3px 7px;font-size:10px}

/* ---- 单人物人脸池模式 ---- */
.pool-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:-6px 0 16px;padding:12px 16px;background:#ffffff;border:1px solid var(--line);border-radius:13px}
.pool-banner .who{font-weight:600;font-size:15px}
.pool-banner .hint{color:var(--muted);font-size:12px}
.pool-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-left:auto}
.pool-controls label{font-size:12px;color:var(--muted)}
.pool-controls input[type=range]{width:120px}
.pool-controls .num{font-size:12px;color:var(--muted);min-width:70px}
.pool-controls .quiet{padding:7px 14px;font-size:12px;border-radius:18px}
.pool-controls .quiet.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:90px}
.fcard{position:relative;background:#ffffff;border:1px solid var(--line);border-radius:13px;overflow:hidden;cursor:pointer;border:3px solid transparent;transition:box-shadow .1s}
.fcard:hover{box-shadow:0 4px 14px #00000014}
.fcard.sel{border-color:var(--accent)}
.fcard .crop{position:relative;aspect-ratio:1;background:#ebebe9;overflow:hidden}
.fcard .crop img{position:absolute;display:block;max-width:none}
.fcard .crop.err{background:#ebebe9}
.fcard .meta{padding:7px 9px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.fcard .sim{position:absolute;left:6px;top:6px;background:var(--accent);color:#fff;border-radius:10px;padding:2px 7px;font-size:10px;font-weight:600;z-index:1}
.fcard .op{position:absolute;right:4px;top:4px;border:0;background:#0009;color:#fff;border-radius:8px;padding:3px 7px;font-size:10px;cursor:pointer;opacity:0;transition:opacity .15s}
.fcard:hover .op{opacity:1}
.pool-bar{position:fixed;left:0;right:0;bottom:0;background:#ffffff;border-top:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:12px;justify-content:space-between;z-index:8;box-shadow:0 -2px 10px #0000000a}
/* ===== 搜索结果 → 人脸网格（直接标注） ===== */
.face-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding-bottom:90px}
.face-grid .face{position:relative;background:#ffffff;border:1px solid var(--line);border-radius:13px;padding:10px}
.face-grid .face .crop{position:relative;aspect-ratio:1;background:#ebebe9;border-radius:9px;overflow:hidden;margin-bottom:8px}
.face-grid .face .crop img{position:absolute;width:100%;height:100%;object-fit:cover;display:block}
.face-grid .face .op{position:absolute;right:4px;top:4px;border:0;background:#0009;color:#fff;border-radius:8px;padding:3px 7px;font-size:10px;cursor:pointer;opacity:0;transition:opacity .15s}
.face-grid .face:hover .op{opacity:1}
.face-grid .face .meta{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:6px}
.face-grid .face .who{font-size:12px;padding:7px 9px;width:100%;border:1px solid var(--line);border-radius:9px;background:#ffffff}
.face-grid .face .who.mod{border-color:var(--accent);background:#fdeeee}
.pool-bar .actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---- 高频未标注簇卡片(保留给无 person 参数时的照片标注页) ---- */
.clusters{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px}
.cl{background:#ffffff;border:1px solid var(--line);border-radius:13px;padding:12px}
.cl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.cl-head b{font-size:14px}.cl-head span{font-size:11px;color:var(--muted)}
.cl-crops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.crop{position:relative;aspect-ratio:1;background:#ebebe9;border-radius:9px;overflow:hidden;cursor:pointer;border:2px solid transparent;padding:0}
.crop.sel{border-color:var(--accent)}
.crop img{position:absolute;display:block;max-width:none}
.crop .dt{position:absolute;left:3px;bottom:3px;background:#0009;color:#fff;border-radius:8px;padding:1px 5px;font-size:10px;pointer-events:none}
.crop .op{position:absolute;right:3px;top:3px;border:0;background:#0009;color:#fff;border-radius:7px;padding:2px 6px;font-size:10px;cursor:pointer;opacity:0;transition:opacity .15s}
.crop:hover .op{opacity:1}
.cl-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.cl-foot select,.cl-foot button{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#ffffff;font-size:13px}
.cl-foot .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.cl-foot .wholectrl{grid-column:1/3;display:flex;gap:6px}
.cl-foot .wholectrl button{flex:1}
.cl-hint{font-size:11px;color:var(--muted);margin-top:8px}

.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.face{background:#ffffff;border:1px solid var(--line);border-radius:13px;padding:10px}
.face.newface{border:2px dashed var(--accent)}
.face .crop{position:relative;background:#ebebe9;border-radius:9px;overflow:hidden;margin-bottom:8px}
.face .crop img{width:100%;display:block}
.face .box{position:absolute;border:2px solid #fff;box-shadow:0 0 0 2px #1118;pointer-events:none}
.face .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}
.face select,.face .np{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#ffffff}
.face .np{margin-top:6px;display:grid;gap:6px;grid-template-columns:1fr 1fr}
.face .rm,.crop .rm{position:absolute;top:8px;right:8px;z-index:2;border:0;background:#000b;color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:13px;line-height:1;opacity:0;transition:opacity .15s}
.face:hover .rm,.crop:hover .rm{opacity:1}
.face .rm:focus,.crop .rm:focus{opacity:1}
.badge{position:absolute;left:6px;bottom:6px;background:#000b;color:#fff;border-radius:11px;padding:3px 7px;font-size:10px}
.stage{position:relative;display:inline-block;border-radius:13px;overflow:hidden;line-height:0;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.stage img{max-width:100%;max-height:56vh;display:block;pointer-events:none}
.fb{position:absolute;border:2px solid #fff;box-shadow:0 0 0 2px #1117;pointer-events:none;border-radius:4px}
.fb i{position:absolute;left:4px;top:-22px;background:#000b;color:#fff;border-radius:9px;padding:2px 8px;font-size:11px;font-style:normal;white-space:nowrap;line-height:1.4}
.fb.isnew{border-color:var(--accent);box-shadow:0 0 0 2px #e5484d55}
#selRect{position:absolute;border:2px dashed var(--accent);background:#e5484d22;pointer-events:none;display:none;border-radius:4px}
.photoview{margin-bottom:18px}.drawhint{font-size:12px;color:var(--muted);margin:8px 0 0}
.empty{padding:30px;background:#ffffff;border:1px dashed var(--line);border-radius:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#131314;color:#fff;border-radius:14px;padding:12px 18px;font-size:13px;opacity:0;transition:opacity .25s;z-index:10;max-width:90vw}
.sel-rect{position:absolute;border:1px dashed var(--accent);background:#e5484d22;pointer-events:none;display:none;z-index:3;border-radius:4px}
/* ---- 从照片/视频新建人脸 ---- */
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.modal-box{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:720px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:16px}
.modal-body{padding:18px;overflow:auto}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.upload-drop{border:2px dashed var(--line);border-radius:13px;padding:28px;text-align:center;background:#ffffff;cursor:pointer;transition:border-color .15s}
.upload-drop:hover,.upload-drop.dragover{border-color:var(--accent)}
.upload-drop input{display:none}
.upload-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.uface{position:relative;background:#ffffff;border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;text-align:center}
.uface.sel{border-color:var(--accent);background:#fdeeee}
.uface img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:#ebebe9}
.uface span{font-size:11px;color:var(--muted)}
.newface-form{display:grid;gap:10px;margin-top:14px}
.newface-form label{font-size:12px;color:var(--muted)}
.newface-form input,.newface-form select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#ffffff;width:100%}
.modal .primary{padding:9px 18px}
.modal .quiet{padding:9px 15px}
@media(max-width:850px){.grid{grid-template-columns:repeat(4,1fr)}.top{align-items:flex-start;flex-wrap:wrap}.toolbar{margin-left:0;width:100%}.pool{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}}
</style><link rel="stylesheet" href="/theme.css?v=06"><link rel="stylesheet" href="/ui.css?v=2">

<body>
<header class="top"><button class="back" onclick="location.href='/people.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> 人物管理</button>
<div><h1 id="pageTitle">照片标注人物</h1><p>在照片上给脸标姓名关系（含拖框补漏检的脸），其余照片自动归类；人物上限 30</p></div>
<div class="toolbar" id="tabsBar"><div class="tabs"><button id="tabPhoto" class="on" onclick="setMode('photo')">照片标注</button><button id="tabPool" onclick="setMode('pool')">未认领池</button></div></div>
</header>
<main class="wrap">
  <div id="status" class="status">正在读取…</div>
  <div id="poolBanner" class="pool-banner" style="display:none">
    <span class="who" id="poolWho">—</span>
    <span class="hint" id="poolHint">候选面孔按与 TA 的相似度排序，越像越靠前</span>
    <div class="pool-controls">
      <label id="threshBar">相似度阈值 <input id="thresh" type="range" min="0" max="0.80" step="0.05" value="0" oninput="onThreshChange()"><span id="threshVal">全部</span></label>
      <button class="quiet" id="confirmedBtn" onclick="toggleConfirmed()">已确认 <b>0</b> 张</button>
      <span class="num" id="poolNum">读取中…</span>
    </div>
  </div>
  <div id="photoMode">
    <div class="searchbar" id="searchBar"><input id="q" placeholder="按日期/文件名关键词筛选未标注人脸；留空显示全部" onkeydown="if(event.key==='Enter')searchAssets()"><button class="primary" onclick="searchAssets()">搜索人脸</button><button class="quiet" onclick="openCreateFaceModal()">+ 从照片/视频新建人脸</button></div>
    <p class="status" style="margin:-8px 0 12px;font-size:11px">💡 直接展示所有未标注人脸，可用上方框按日期/文件名筛选；逐个选人物后底部一键保存。</p>
<div id="shots"></div>
    <div id="detail" style="display:none">
      <div class="photoview"><div class="stage" id="stage"><img id="photoImg" decoding="async"><div id="boxes"></div><div id="selRect"></div></div><div id="photoMeta" class="status"></div><p class="drawhint">💡 在照片上<b>按住拖动</b>即可框选检测漏掉的脸（小脸/侧脸/远景常见）；松开后为这张脸选人物，一起保存。白框=已检测，橙框=你新拖的。</p></div>
      <div style="display:flex;gap:8px;align-items:center;margin:10px 0 14px"><button class="quiet" onclick="closeDetail()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> 换一张照片</button><button id="saveLabels" class="primary" onclick="saveLabels()">保存标注并自动归类</button><span class="status" id="saveHint"></span></div>
      <div id="faces" class="faces"></div>
    </div>
  </div>
  <div id="poolMode" style="display:none">
    <div style="display:flex;gap:8px;margin-bottom:14px"><select id="person"></select><button class="primary" id="save" onclick="savePool()">确认选中人脸</button><button class="quiet" onclick="selectAllGrid()">全选</button><button class="quiet" onclick="clearSel()">清除</button><span class="status" id="poolTip" style="align-self:center"></span></div>
    <div id="grid" class="grid"></div>
  </div>
</main>
<div id="createFaceModal" class="modal" onclick="if(event.target===this)closeCreateFaceModal()">
  <div class="modal-box">
    <div class="modal-head"><h3>从照片或视频新建人脸</h3><button class="quiet" onclick="closeCreateFaceModal()">关闭</button></div>
    <div class="modal-body">
      <label class="upload-drop" id="uploadDrop">
        <input type="file" id="uploadInput" accept="image/*,video/*" onchange="onUploadFile(this)">
        <div id="uploadHint">点击选择或拖拽照片/视频到此处<br><span style="font-size:12px;color:var(--muted)">支持 jpg/png/heic/mp4/mov 等格式</span></div>
      </label>
      <div id="uploadFaces" class="upload-preview" style="display:none"></div>
      <div id="newFaceForm" class="newface-form" style="display:none">
        <label>人物姓名（新建）</label>
        <input id="newFaceName" placeholder="例如：小明">
        <label>或归属到现有人物</label>
        <select id="newFacePerson"><option value="">— 新建人物 —</option></select>
      </div>
      <div id="uploadStatus" class="status" style="margin-top:10px"></div>
    </div>
    <div class="modal-foot">
      <button class="quiet" onclick="closeCreateFaceModal()">取消</button>
      <button class="primary" id="confirmCreateBtn" onclick="confirmCreateFace()" disabled>确认创建</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
let people=[], selected=new Set(), curAsset=null, curAssetMeta=null, curFaces=[], newFaces=[];
let poolFaces=[], poolSel=new Set(), lastClickedIdx=-1, poolSortedBy='similarity';
let gridModified=new Set();
const urlParams=new URLSearchParams(location.search);
const preselectPerson=urlParams.get('person');
const isPoolMode=!!preselectPerson;
const preselectName=()=>{const p=(people||[]).find(x=>x.person_id===preselectPerson);return p?(p.display_name||p.relationship_label||''):''};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NEW='__new__', SKIP='__skip__';
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,4000)}
async function loadPeople(){
  const r=await fetch('/api/people',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  const d=await r.json();people=d.people||[];
  $('person').innerHTML=people.map(p=>`<option value="${esc(p.person_id)}">${esc(p.display_name||'未命名')}</option>`).join('');
  if(preselectPerson) updatePoolBanner();
}
function setMode(m){
  if(isPoolMode)return;
  $('tabPhoto').classList.toggle('on',m==='photo');$('tabPool').classList.toggle('on',m==='pool');
  $('photoMode').style.display=m==='photo'?'':'none';$('poolMode').style.display=m==='pool'?'':'none';
  if(m==='pool'){loadPool()}else{loadFrequentUnlabeled()}
}

/* ---- 单人物人脸池 ---- */
function updatePoolBanner(){
  const name=preselectName();
  if(!name){$('poolWho').textContent='未知人物';return}
  $('poolWho').textContent=`正在为「${esc(name)}」添加人脸`;
}
async function loadFacePool(){
  if(!preselectPerson)return;
  $('pageTitle').textContent='添加人脸';
  $('tabsBar').style.display='none';
  $('searchBar').style.display='none';
  $('poolBanner').style.display='';
  $('status').textContent='正在按相似度排列候选面孔…';
  try{
    const threshold=parseFloat($('thresh').value);
    const tv=$('threshVal');if(tv)tv.textContent=threshold<=0?'全部':threshold.toFixed(2);
    const r=await fetch('/api/unlabeled/similar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({person_id:preselectPerson,threshold,limit:8000})});
    const d=await r.json();if(!r.ok){toast(d.error||'读取失败');return}
    poolFaces=d.faces||[];
    poolSortedBy=d.sorted_by||'similarity';
    const qualityMode=poolSortedBy==='quality';
    $('threshBar').style.display=qualityMode?'none':'';
    $('poolHint').textContent=qualityMode?'还没有已确认人脸，以下按质量排序，选几张即可建立识别基准':'默认加载全部候选面孔，按与 TA 的相似度排序（越像越靠前），可拖阈值收窄';
    document.querySelectorAll('.selhigh').forEach(b=>b.style.display=qualityMode?'none':'');
    renderPool();
  }catch(e){$('status').textContent='读取失败：'+e.message}
}
function onThreshChange(){loadFacePool()}
/* 新人脸裁切：以 bbox 中心放大 2 倍取景（带头发/肩膀），cover 填满正方形容器 */
function cropStyle(b){
  const W=+b.image_width||1000,H=+b.image_height||750,r=(W/H)||1;
  let w=Math.max(+b.w||0.01,0.001),h=Math.max(+b.h||0.01,0.001);
  let x=+b.x||0,y=+b.y||0;
  // bbox 中心扩展 2 倍，并裁剪到图像范围内
  const cx=x+w/2,cy=y+h/2;
  w=Math.min(w*2,1);h=Math.min(h*2,1);
  x=Math.max(0,cx-w/2);y=Math.max(0,cy-h/2);
  w=Math.min(w,1-x);h=Math.min(h,1-y);
  const wp=100*Math.max(1/w,r/h);
  const hp=100*Math.max(1/(w*r),1/h);
  return `width:${wp.toFixed(2)}%;height:${hp.toFixed(2)}%;left:${(-x*wp).toFixed(2)}%;top:${(-y*hp).toFixed(2)}%;`;
}
// 2026-09-17 改：旧行为是「图片加载失败 → 删掉整张卡片」，结果这些脸从墙面上凭空消失，
// 看着像「照片丢了」。现在：先原地重试一次（服务端并发读图偶发超时），仍失败则占位显示「读图失败」，
// 卡片和位置都保留 —— 用户能看出「这张读不出来」，而不是「少了几张」。
function imgFail(el){
  const src=el.getAttribute('src')||'';
  if(src&&!el.dataset.retried){
    el.dataset.retried='1';
    setTimeout(()=>{el.src=src+(src.includes('?')?'&':'?')+'_r='+Date.now()},800);
    return;
  }
  el.onerror=null;
  const box=el.closest('.crop,.fc,.hero-av,.pick,.av')||el.parentElement;
  if(!box)return;
  box.classList.add('imgerr');
  el.style.display='none';
  if(!box.querySelector('.imgerr-tag'))box.insertAdjacentHTML('beforeend','<span class="imgerr-tag">读图失败</span>');
}

/* 通用拖拽框选：任意位置(含卡片上)按下拖动即框选，按下后位移<6px 视为单击不干扰 */
function bindRectSelect(container, applySel){
  let drag=null,rectEl=null,selecting=false;
  container.onmousedown=e=>{
    if(e.button!==0||e.target.closest('.op'))return;
    drag={x0:e.clientX,y0:e.clientY};selecting=false;
  };
  container.onmousemove=e=>{
    if(!drag)return;e.preventDefault();
    const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
    if(!selecting&&Math.hypot(dx,dy)<=6)return;
    if(!selecting){
      selecting=true;
      if(!rectEl){rectEl=document.createElement('div');rectEl.className='sel-rect';rectEl.style.position='fixed';rectEl.style.zIndex='9';document.body.appendChild(rectEl)}
      rectEl.style.display='block';
    }
    const x1=Math.min(drag.x0,e.clientX),y1=Math.min(drag.y0,e.clientY);
    rectEl.style.left=x1+'px';rectEl.style.top=y1+'px';
    rectEl.style.width=Math.abs(dx)+'px';rectEl.style.height=Math.abs(dy)+'px';
  };
  container.onmouseup=e=>{
    if(!drag)return;
    const moved=Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0);
    if(selecting&&rectEl){
      const rc=rectEl.getBoundingClientRect();
      container.querySelectorAll('.fcard,.face').forEach(el=>{
        const ec=el.getBoundingClientRect();
        if(ec.right>=rc.left&&ec.left<=rc.right&&ec.bottom>=rc.top&&ec.top<=rc.bottom)applySel(el);
      });
      rectEl.style.display='none';
      suppressClick=true;setTimeout(()=>suppressClick=false,120);
    }
    drag=null;selecting=false;
  };
}

let drag=null;
const stage=$('stage'),selRect=$('selRect'),photoImg=$('photoImg');
stage.addEventListener('pointerdown',e=>{
  if(!curAsset)return;
  if(!photoImg.naturalWidth)return;
  const r=photoImg.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;
  stage.setPointerCapture(e.pointerId);
  drag={x0:(e.clientX-r.left)/r.width,y0:(e.clientY-r.top)/r.height};
  selRect.style.display='block';moveSel((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);
});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;
  const r=photoImg.getBoundingClientRect();
  moveSel(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)));
});
function moveSel(x,y){
  const x1=Math.min(drag.x0,x),y1=Math.min(drag.y0,y);
  selRect.style.left=x1*100+'%';selRect.style.top=y1*100+'%';
  selRect.style.width=Math.abs(x-drag.x0)*100+'%';selRect.style.height=Math.abs(y-drag.y0)*100+'%';
}
stage.addEventListener('pointerup',e=>{
  if(!drag)return;
  const r=photoImg.getBoundingClientRect();
  const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
  const b={x:Math.min(drag.x0,x),y:Math.min(drag.y0,y),w:Math.abs(x-drag.x0),h:Math.abs(y-drag.y0),image_width:photoImg.naturalWidth,image_height:photoImg.naturalHeight};
  drag=null;selRect.style.display='none';
  if(b.w<0.02||b.h<0.02){return}
  if(newFaces.length+curFaces.length>=40){toast('一张照片最多 40 张脸');return}
  newFaces.push({bbox:b});
  renderBoxes();renderFaces();
  const cards=$('faces').querySelectorAll('.newface');
  cards[cards.length-1]?.querySelector('.who')?.focus();
  toast('已框选一张脸，请在下方为它选择人物');
});
stage.addEventListener('pointercancel',()=>{drag=null;selRect.style.display='none'});

    toast('人物创建成功');
    closeCreateFaceModal();
    await loadPeople();
    if(!isPoolMode)await loadAllUnlabeled();
  }catch(e){toast('创建异常：'+e.message);$('uploadStatus').textContent=''}
}
/* 拖拽上传 */
const drop=$('uploadDrop');
['dragenter','dragover'].forEach(ev=>{drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('dragover')})});
['dragleave','drop'].forEach(ev=>{drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('dragover')})});
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f){const input=$('uploadInput');const dt=new DataTransfer();dt.items.add(f);input.files=dt.files;onUploadFile(input)}});
/* ESC 关闭「新建人脸」弹窗 */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if($('createFaceModal').classList.contains('on')){e.preventDefault();closeCreateFaceModal()}
});

loadPeople().then(()=>{
  if(isPoolMode){renderPoolBar();loadFacePool()}else{loadAllUnlabeled()}
}).catch(e=>$('status').textContent='读取失败：'+e.message);
</script><script src="offline-guard.js"></script>
</body></html>
